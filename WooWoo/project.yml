name: WooWoo
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  WooWoo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    # Capability Game Center: senza questo entitlement GKLocalPlayer.authenticate fallisce
    # anche con device loggato a Game Center (isAuthenticated resta false).
    # XcodeGen genera il file .entitlements e imposta CODE_SIGN_ENTITLEMENTS.
    entitlements:
      path: Sources/App/WooWoo.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woowoothegame
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/App/Info.plist
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        SUPPORTED_INTERFACE_ORIENTATIONS: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WooWooTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WooWoo
schemes:
  WooWoo:
    build:
      targets:
        WooWoo: all
    test:
      targets: [WooWooTests]
